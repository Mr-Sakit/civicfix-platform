name: CivicFix Terraform Drift Detection

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: infrastructure/terraform/azure

jobs:
  drift-detection:
    name: Detect Azure infrastructure drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Render Terraform backend config
        run: |
          cat > "$TF_WORKING_DIR/backend/backend.config" <<EOF
          resource_group_name  = "${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}"
          storage_account_name = "${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}"
          container_name       = "${{ vars.TFSTATE_CONTAINER_NAME }}"
          key                  = "${{ vars.TFSTATE_KEY }}"
          EOF

      - name: Terraform init
        run: terraform -chdir="$TF_WORKING_DIR" init -backend-config=backend/backend.config

      - name: Terraform drift plan
        id: drift
        env:
          TF_VAR_environment: prod
          TF_VAR_resource_suffix: 18j6j6
          TF_VAR_manage_generated_key_vault_secrets: "false"
          TF_VAR_create_managed_postgres: "true"
          TF_VAR_aks_api_server_authorized_ip_ranges: '["${{ vars.TF_VAR_AKS_API_SERVER_AUTHORIZED_IP_RANGES }}"]'
          TF_VAR_key_vault_allowed_ip_ranges: '["${{ vars.TF_VAR_KEY_VAULT_ALLOWED_IP_RANGES }}"]'
        run: |
          set +e
          terraform -chdir="$TF_WORKING_DIR" plan -detailed-exitcode -no-color -out=tfdrift
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          exit 0

      - name: Fail when drift is detected
        if: steps.drift.outputs.exitcode == '2'
        run: |
          echo "::error::Terraform drift detected. Review the workflow log and reconcile Azure with Terraform."
          exit 1
