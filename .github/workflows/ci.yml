name: CivicFix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  application-checks:
    name: Application checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check backend syntax
        run: npm run backend:check

      - name: Build frontend
        run: npm run frontend:build

  container-builds:
    name: Container build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: civicfix-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: civicfix-frontend:ci

  kubernetes-validation:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Render Kubernetes base
        run: kubectl kustomize deploy/kubernetes/base

      - name: Render Kubernetes dev overlay
        run: kubectl kustomize deploy/kubernetes/overlays/dev

      - name: Render Kubernetes prod overlay
        run: kubectl kustomize deploy/kubernetes/overlays/prod

      - name: Render Kubernetes monitoring
        run: kubectl kustomize deploy/kubernetes/monitoring

      - name: Render External Secrets Azure Key Vault manifests
        run: kubectl kustomize deploy/kubernetes/secrets/external-secrets/azure-key-vault

      - name: Render Argo CD GitOps bootstrap
        run: kubectl kustomize deploy/gitops/argocd/bootstrap

      - name: Render Argo CD GitOps applications
        run: kubectl kustomize deploy/gitops/argocd/apps

      - name: Validate Prometheus alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD:/workspace" prom/prometheus:v3.7.3 check rules /workspace/deploy/kubernetes/monitoring/prometheus-rules/civicfix-alerts.yaml

  infrastructure-validation:
    name: Infrastructure validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure/terraform/azure

      - name: Initialize Terraform without backend
        run: terraform -chdir=infrastructure/terraform/azure init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infrastructure/terraform/azure validate
