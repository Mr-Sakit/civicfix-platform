name: CivicFix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  application-checks:
    name: Application checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check backend syntax
        run: npm run backend:check

      - name: Build frontend
        run: npm run frontend:build

  container-builds:
    name: Container build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: civicfix-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: civicfix-frontend:ci

  kubernetes-validation:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Render Kubernetes base
        run: kubectl kustomize deploy/kubernetes/base

      - name: Render Kubernetes monitoring
        run: kubectl kustomize deploy/kubernetes/monitoring
