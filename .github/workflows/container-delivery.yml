name: CivicFix Container Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/mr-sakit/civicfix-backend
  FRONTEND_IMAGE: ghcr.io/mr-sakit/civicfix-frontend

jobs:
  publish-images:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and publish backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and publish frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Sign backend image digest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ env.BACKEND_IMAGE }}@${{ steps.build-backend.outputs.digest }}"

      - name: Sign frontend image digest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ env.FRONTEND_IMAGE }}@${{ steps.build-frontend.outputs.digest }}"
