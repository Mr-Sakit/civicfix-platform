name: CivicFix Container Delivery

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/container-delivery.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/mr-sakit/civicfix-backend
  FRONTEND_IMAGE: ghcr.io/mr-sakit/civicfix-frontend

jobs:
  publish-images:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and publish backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and publish frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Sign backend image digest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ env.BACKEND_IMAGE }}@${{ steps.build-backend.outputs.digest }}"

      - name: Sign frontend image digest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ env.FRONTEND_IMAGE }}@${{ steps.build-frontend.outputs.digest }}"

      - name: Promote signed digests to production overlay
        env:
          BACKEND_DIGEST: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("deploy/kubernetes/overlays/prod/kustomization.yaml")
          replacements = {
              "ghcr.io/mr-sakit/civicfix-backend": os.environ["BACKEND_DIGEST"],
              "ghcr.io/mr-sakit/civicfix-frontend": os.environ["FRONTEND_DIGEST"],
          }

          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          active_image = None

          for line in lines:
              stripped = line.strip()
              if stripped.startswith("- name: "):
                  active_image = stripped.removeprefix("- name: ").strip()
                  output.append(line)
                  continue

              if active_image in replacements and (
                  stripped.startswith("newTag:")
                  or stripped.startswith("digest:")
              ):
                  output.append(f"    digest: {replacements[active_image]}")
                  continue

              output.append(line)

          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Commit production digest promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kubernetes/overlays/prod/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production overlay already references these image digests."
            exit 0
          fi
          git commit -m "Promote signed production image digests [skip ci]"
          git push
