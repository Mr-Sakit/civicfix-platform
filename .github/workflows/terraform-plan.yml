name: CivicFix Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: infrastructure/terraform/azure

jobs:
  terraform-validation:
    name: Terraform format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive "$TF_WORKING_DIR"

      - name: Terraform init without backend
        run: terraform -chdir="$TF_WORKING_DIR" init -backend=false

      - name: Terraform validate
        run: terraform -chdir="$TF_WORKING_DIR" validate

  terraform-plan:
    name: Terraform cloud plan
    runs-on: ubuntu-latest
    needs: terraform-validation
    if: ${{ vars.AZURE_OIDC_CONFIGURED == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Render Terraform backend config
        run: |
          cat > "$TF_WORKING_DIR/backend/backend.config" <<EOF
          resource_group_name  = "${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}"
          storage_account_name = "${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}"
          container_name       = "${{ vars.TFSTATE_CONTAINER_NAME }}"
          key                  = "${{ vars.TFSTATE_KEY }}"
          EOF

      - name: Terraform init
        run: terraform -chdir="$TF_WORKING_DIR" init -backend-config=backend/backend.config

      - name: Terraform validate
        run: terraform -chdir="$TF_WORKING_DIR" validate

      - name: Terraform plan
        env:
          TF_VAR_environment: prod
          TF_VAR_resource_suffix: 18j6j6
          TF_VAR_manage_generated_key_vault_secrets: "false"
          TF_VAR_create_managed_postgres: "true"
          TF_VAR_aks_api_server_authorized_ip_ranges: '["${{ vars.TF_VAR_AKS_API_SERVER_AUTHORIZED_IP_RANGES }}"]'
          TF_VAR_key_vault_allowed_ip_ranges: '["${{ vars.TF_VAR_KEY_VAULT_ALLOWED_IP_RANGES }}"]'
        run: terraform -chdir="$TF_WORKING_DIR" plan -no-color -out=tfplan

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

  terraform-plan-skipped:
    name: Terraform cloud plan skipped
    runs-on: ubuntu-latest
    needs: terraform-validation
    if: ${{ vars.AZURE_OIDC_CONFIGURED != 'true' }}

    steps:
      - name: Explain skipped cloud plan
        run: |
          echo "::notice::Terraform cloud plan skipped because Azure OIDC secrets are not configured yet."
          echo "Configure AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and Terraform backend variables to enable gated PR plans."
