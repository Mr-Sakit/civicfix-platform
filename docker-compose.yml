services:
  frontend:
    build:
      context: ./frontend
    container_name: civicfix-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    container_name: civicfix-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://civicfix_user:${POSTGRES_PASSWORD:-change-me}@postgres:5432/civicfix
      CORS_ORIGIN: http://localhost:3000
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_BLOB_CONTAINER: ${AZURE_STORAGE_BLOB_CONTAINER:-issue-photos}
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-none}
      AZURE_STORAGE_QUEUE_NAME: ${AZURE_STORAGE_QUEUE_NAME:-image-analysis-jobs}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    container_name: civicfix-ai-worker
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://civicfix_user:${POSTGRES_PASSWORD:-change-me}@postgres:5432/civicfix
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-none}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_QUEUE_NAME: ${AZURE_STORAGE_QUEUE_NAME:-image-analysis-jobs}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_METRICS_PORT: 9100
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: civicfix-postgres
    environment:
      POSTGRES_DB: civicfix
      POSTGRES_USER: civicfix_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix_user -d civicfix"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicfix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
