services:
  postgres:
    image: postgres:16-alpine
    container_name: civicfix-postgres
    environment:
      POSTGRES_DB: civicfix
      POSTGRES_USER: civicfix_user
      POSTGRES_PASSWORD: civicfix_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix_user -d civicfix"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicfix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
