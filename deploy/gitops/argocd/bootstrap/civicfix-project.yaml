apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: civicfix-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: civicfix-platform
    app.kubernetes.io/part-of: civicfix-platform
spec:
  description: GitOps project for CivicFix application and operations layers.
  sourceRepos:
    - git@github.com:Mr-Sakit/civicfix-platform.git
    - https://github.com/Mr-Sakit/civicfix-platform.git
    - https://kyverno.github.io/kyverno/
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: civicfix-student
      server: https://kubernetes.default.svc
    - namespace: civicfix-monitoring
      server: https://kubernetes.default.svc
    - namespace: civicfix-dev
      server: https://kubernetes.default.svc
    - namespace: civicfix-prod
      server: https://kubernetes.default.svc
    - namespace: civicfix
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: kyverno.io
      kind: ClusterPolicy
    - group: kyverno.io
      kind: ClusterPolicyException
    - group: reports.kyverno.io
      kind: ClusterPolicyReport
    - group: wgpolicyk8s.io
      kind: ClusterPolicyReport
    - group: external-secrets.io
      kind: ClusterSecretStore
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
