apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civicfix-prod-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/name: civicfix-prod-secrets
    app.kubernetes.io/part-of: civicfix-platform
    civicfix.io/environment: prod
spec:
  project: civicfix-platform
  source:
    repoURL: https://github.com/Mr-Sakit/civicfix-platform.git
    targetRevision: main
    path: deploy/kubernetes/secrets/external-secrets/azure-key-vault
  destination:
    server: https://kubernetes.default.svc
    namespace: civicfix-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
