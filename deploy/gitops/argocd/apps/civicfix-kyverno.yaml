apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civicfix-kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
  labels:
    app.kubernetes.io/name: civicfix-kyverno
    app.kubernetes.io/part-of: civicfix-platform
spec:
  project: civicfix-platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      releaseName: kyverno
      values: |
        crds:
          install: true
          annotations:
            argocd.argoproj.io/sync-options: Replace=true
          groups:
            policies:
              deletingpolicies: false
              generatingpolicies: false
              imagevalidatingpolicies: false
              mutatingpolicies: false
              namespaceddeletingpolicies: false
              namespacedimagevalidatingpolicies: false
              namespacedmutatingpolicies: false
              namespacedvalidatingpolicies: false
              policyexceptions: false
              validatingpolicies: false
          migration:
            enabled: false
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec
