apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civicfix-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: civicfix-monitoring
    app.kubernetes.io/part-of: civicfix-platform
spec:
  project: civicfix-platform
  source:
    repoURL: https://github.com/Mr-Sakit/civicfix-platform.git
    targetRevision: main
    path: deploy/kubernetes/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: civicfix-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
