apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civicfix-external-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    app.kubernetes.io/name: civicfix-external-secrets-operator
    app.kubernetes.io/part-of: civicfix-platform
spec:
  project: civicfix-platform
  source:
    repoURL: https://github.com/Mr-Sakit/civicfix-platform.git
    targetRevision: main
    path: deploy/kubernetes/secrets/external-secrets/operator
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
