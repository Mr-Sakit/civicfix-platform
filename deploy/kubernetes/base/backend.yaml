apiVersion: v1
kind: Service
metadata:
  name: civicfix-backend
  labels:
    app.kubernetes.io/name: civicfix-backend
    app.kubernetes.io/part-of: civicfix-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: civicfix-backend
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicfix-backend
  labels:
    app.kubernetes.io/name: civicfix-backend
    app.kubernetes.io/part-of: civicfix-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: civicfix-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civicfix-backend
        app.kubernetes.io/part-of: civicfix-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: ghcr.io/mr-sakit/civicfix-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: BACKEND_PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: CORS_ORIGIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: civicfix-app-secret
                  key: DATABASE_URL
            - name: STORAGE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: STORAGE_PROVIDER
            - name: AZURE_STORAGE_BLOB_CONTAINER
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: AZURE_STORAGE_BLOB_CONTAINER
            - name: QUEUE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: QUEUE_PROVIDER
            - name: AZURE_STORAGE_QUEUE_NAME
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: AZURE_STORAGE_QUEUE_NAME
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: civicfix-app-secret
                  key: AZURE_STORAGE_CONNECTION_STRING
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
