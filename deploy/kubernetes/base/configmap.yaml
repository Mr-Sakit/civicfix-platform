apiVersion: v1
kind: ConfigMap
metadata:
  name: civicfix-app-config
  labels:
    app.kubernetes.io/name: civicfix-platform
    app.kubernetes.io/part-of: civicfix-platform
data:
  NODE_ENV: "production"
  BACKEND_PORT: "4000"
  FRONTEND_PORT: "3000"
  CORS_ORIGIN: "http://localhost:3000"
  VITE_API_BASE_URL: "http://localhost:4000"
  STORAGE_PROVIDER: "local"
  AZURE_STORAGE_BLOB_CONTAINER: "issue-photos"
  QUEUE_PROVIDER: "none"
  AZURE_STORAGE_QUEUE_NAME: "image-analysis-jobs"
  WORKER_POLL_INTERVAL_MS: "5000"
  POSTGRES_DB: "civicfix"
  POSTGRES_USER: "civicfix_user"
  POSTGRES_HOST: "civicfix-postgres"
  POSTGRES_PORT: "5432"
