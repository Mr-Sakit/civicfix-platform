apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicfix-default-deny-ingress
  labels:
    app.kubernetes.io/name: civicfix-network-policy
    app.kubernetes.io/part-of: civicfix-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicfix-default-deny-egress
  labels:
    app.kubernetes.io/name: civicfix-network-policy
    app.kubernetes.io/part-of: civicfix-platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicfix-allow-ingress-to-frontend
  labels:
    app.kubernetes.io/name: civicfix-network-policy
    app.kubernetes.io/part-of: civicfix-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: civicfix-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicfix-allow-ingress-to-backend
  labels:
    app.kubernetes.io/name: civicfix-network-policy
    app.kubernetes.io/part-of: civicfix-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: civicfix-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: civicfix-frontend
      ports:
        - protocol: TCP
          port: 4000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
