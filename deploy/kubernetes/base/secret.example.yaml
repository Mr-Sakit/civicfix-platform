apiVersion: v1
kind: Secret
metadata:
  name: civicfix-app-secret
  labels:
    app.kubernetes.io/name: civicfix-platform
    app.kubernetes.io/part-of: civicfix-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-with-environment-password"
  DATABASE_URL: "postgres://civicfix_user:replace-with-environment-password@civicfix-postgres:5432/civicfix"
