apiVersion: v1
kind: Service
metadata:
  name: civicfix-ai-worker
  labels:
    app.kubernetes.io/name: civicfix-ai-worker
    app.kubernetes.io/part-of: civicfix-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: civicfix-ai-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicfix-ai-worker
  labels:
    app.kubernetes.io/name: civicfix-ai-worker
    app.kubernetes.io/part-of: civicfix-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: civicfix-ai-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civicfix-ai-worker
        app.kubernetes.io/part-of: civicfix-platform
    spec:
      containers:
        - name: worker
          image: ghcr.io/mr-sakit/civicfix-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - worker
          ports:
            - name: metrics
              containerPort: 9100
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: civicfix-app-secret
                  key: DATABASE_URL
            - name: QUEUE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: QUEUE_PROVIDER
            - name: AZURE_STORAGE_QUEUE_NAME
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: AZURE_STORAGE_QUEUE_NAME
            - name: WORKER_POLL_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: WORKER_POLL_INTERVAL_MS
            - name: WORKER_METRICS_PORT
              value: "9100"
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: civicfix-app-secret
                  key: AZURE_STORAGE_CONNECTION_STRING
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
