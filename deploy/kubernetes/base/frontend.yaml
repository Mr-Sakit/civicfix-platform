apiVersion: v1
kind: Service
metadata:
  name: civicfix-frontend
  labels:
    app.kubernetes.io/name: civicfix-frontend
    app.kubernetes.io/part-of: civicfix-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: civicfix-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicfix-frontend
  labels:
    app.kubernetes.io/name: civicfix-frontend
    app.kubernetes.io/part-of: civicfix-platform
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: civicfix-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civicfix-frontend
        app.kubernetes.io/part-of: civicfix-platform
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/mr-sakit/civicfix-frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: VITE_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: civicfix-app-config
                  key: VITE_API_BASE_URL
          volumeMounts:
            - name: vite-temp
              mountPath: /app/node_modules/.vite-temp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: vite-temp
          emptyDir: {}
