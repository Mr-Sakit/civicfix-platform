apiVersion: v1
kind: ServiceAccount
metadata:
  name: civicfix-prometheus
  labels:
    app.kubernetes.io/name: civicfix-prometheus
    app.kubernetes.io/part-of: civicfix-platform
---
# RBAC so Prometheus can use Kubernetes service discovery (nodes, pods,
# endpoints, services) and scrape the kubelet/cAdvisor metrics endpoints.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: civicfix-prometheus
  labels:
    app.kubernetes.io/name: civicfix-prometheus
    app.kubernetes.io/part-of: civicfix-platform
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: civicfix-prometheus
  labels:
    app.kubernetes.io/name: civicfix-prometheus
    app.kubernetes.io/part-of: civicfix-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: civicfix-prometheus
subjects:
  - kind: ServiceAccount
    name: civicfix-prometheus
    namespace: civicfix-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: civicfix-prometheus-config
  labels:
    app.kubernetes.io/name: civicfix-prometheus
    app.kubernetes.io/part-of: civicfix-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: civicfix

    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - civicfix-alertmanager:9093

    scrape_configs:
      # Prometheus itself.
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      # Kubernetes control-plane API servers.
      - job_name: kubernetes-apiservers
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Node kubelet metrics.
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # Per-container resource usage from the kubelet's cAdvisor endpoint.
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # Cluster object state (deployments, pods, HPAs, PVCs, ...).
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: civicfix-kube-state-metrics

      # Node hardware/OS metrics from node-exporter.
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: civicfix-node-exporter
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node

      # Application pods opt in via annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/port:   "4000"
      #   prometheus.io/path:   "/metrics"   (optional, defaults to /metrics)
      # This auto-discovers backend/worker pods in ANY namespace, so the stack no
      # longer depends on hardcoded prod service DNS names.
      - job_name: civicfix-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Preserve the app name as the Prometheus `job` so existing alert rules
          # that match job="civicfix-backend"/"civicfix-ai-worker" keep working.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: job
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: civicfix-prometheus-data
  labels:
    app.kubernetes.io/name: civicfix-prometheus
    app.kubernetes.io/part-of: civicfix-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: civicfix-prometheus
  labels:
    app.kubernetes.io/name: civicfix-prometheus
    app.kubernetes.io/part-of: civicfix-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: civicfix-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicfix-prometheus
  labels:
    app.kubernetes.io/name: civicfix-prometheus
    app.kubernetes.io/part-of: civicfix-platform
spec:
  replicas: 1
  # Recreate so the single RWO volume detaches cleanly before the new pod starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: civicfix-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civicfix-prometheus
        app.kubernetes.io/part-of: civicfix-platform
    spec:
      serviceAccountName: civicfix-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.7.3
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: civicfix-prometheus-config
        - name: prometheus-rules
          configMap:
            name: civicfix-prometheus-rules
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: civicfix-prometheus-data
