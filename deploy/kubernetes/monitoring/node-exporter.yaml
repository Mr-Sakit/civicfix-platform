apiVersion: v1
kind: ServiceAccount
metadata:
  name: civicfix-node-exporter
  labels:
    app.kubernetes.io/name: civicfix-node-exporter
    app.kubernetes.io/part-of: civicfix-platform
---
apiVersion: v1
kind: Service
metadata:
  name: civicfix-node-exporter
  labels:
    app.kubernetes.io/name: civicfix-node-exporter
    app.kubernetes.io/part-of: civicfix-platform
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: civicfix-node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: civicfix-node-exporter
  labels:
    app.kubernetes.io/name: civicfix-node-exporter
    app.kubernetes.io/part-of: civicfix-platform
spec:
  # trivy:ignore:AVD-KSV-0121
  # node-exporter requires read-only hostPath mounts for /proc, /sys, and /
  # to expose node-level infrastructure metrics. The pod drops all capabilities,
  # disables privilege escalation, runs as non-root, and mounts host paths read-only.
  selector:
    matchLabels:
      app.kubernetes.io/name: civicfix-node-exporter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civicfix-node-exporter
        app.kubernetes.io/part-of: civicfix-platform
    spec:
      serviceAccountName: civicfix-node-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          imagePullPolicy: IfNotPresent
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
          ports:
            - name: metrics
              containerPort: 9100
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              mountPropagation: HostToContainer
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
