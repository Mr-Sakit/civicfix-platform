apiVersion: v1
kind: ConfigMap
metadata:
  name: civicfix-alertmanager-config
  labels:
    app.kubernetes.io/name: civicfix-alertmanager
    app.kubernetes.io/part-of: civicfix-platform
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity = "critical"
          receiver: default
          repeat_interval: 1h
          continue: true

    receivers:
      # Default receiver has no notifier configured yet, so alerts are visible in
      # the Alertmanager UI but are not pushed anywhere. Wire up a real channel by
      # uncommenting and completing one of the blocks below (put the webhook/API
      # URL in a Secret rather than committing it here).
      - name: default
        # slack_configs:
        #   - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        #     channel: "#civicfix-alerts"
        #     send_resolved: true
        #     title: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"
        #     text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        # webhook_configs:
        #   - url: https://example.com/civicfix-alerts
        #     send_resolved: true

    inhibit_rules:
      # A firing critical alert silences a warning with the same scope.
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["alertname", "namespace", "service"]
---
apiVersion: v1
kind: Service
metadata:
  name: civicfix-alertmanager
  labels:
    app.kubernetes.io/name: civicfix-alertmanager
    app.kubernetes.io/part-of: civicfix-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: civicfix-alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicfix-alertmanager
  labels:
    app.kubernetes.io/name: civicfix-alertmanager
    app.kubernetes.io/part-of: civicfix-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: civicfix-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civicfix-alertmanager
        app.kubernetes.io/part-of: civicfix-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: civicfix-alertmanager-config
        - name: data
          emptyDir: {}
