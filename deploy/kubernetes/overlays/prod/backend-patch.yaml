apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicfix-backend
  labels:
    civicfix.io/environment: prod
spec:
  # replicas intentionally omitted: the HorizontalPodAutoscaler in hpa.yaml
  # owns the replica count in prod (see ignoreDifferences in the Argo CD app).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        civicfix.io/environment: prod
    spec:
      containers:
        - name: backend
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
