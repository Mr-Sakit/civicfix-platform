apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicfix-prod

resources:
  - ../../base
  - certificate.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: ghcr.io/mr-sakit/civicfix-backend
    digest: sha256:89e603b0b1bb1d18f97cfd304eb2df375935a66bdabfb25df85469b64ca5af30
  - name: ghcr.io/mr-sakit/civicfix-frontend
    digest: sha256:9413c7aaad7aabc7ec7c2d7ae7bad2fa516bba01864f6911ed4ce9ecfa68ad58

patches:
  - path: namespace-patch.yaml
    target:
      kind: Namespace
      name: civicfix
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: civicfix-app-config
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: civicfix-backend
  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: civicfix-frontend
  - path: remove-in-cluster-postgres.yaml
