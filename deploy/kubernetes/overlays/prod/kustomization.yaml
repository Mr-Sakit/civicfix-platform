apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicfix-prod

resources:
  - ../../base
  - certificate.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: ghcr.io/mr-sakit/civicfix-backend
    digest: sha256:303040dba07599a94041f5d0c4d6f52708da0ea18b36356a7456ca6edd97cb1d
  - name: ghcr.io/mr-sakit/civicfix-frontend
    digest: sha256:8c2cfb3179922759cb6e6a2230ec64b5b3f62833d1131cd425e72ee261f53aef

patches:
  - path: namespace-patch.yaml
    target:
      kind: Namespace
      name: civicfix
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: civicfix-app-config
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: civicfix-backend
  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: civicfix-frontend
  - path: remove-in-cluster-postgres.yaml
