apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicfix-prod

resources:
  - ../../base
  - certificate.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: ghcr.io/mr-sakit/civicfix-backend
    digest: sha256:837e927dbe32561b17db86e421b685ef1ad2a2dfb4b4f8c1adbe7557bf81ccf2
  - name: ghcr.io/mr-sakit/civicfix-frontend
    digest: sha256:044e86871d10bfa0641116e213d2ba523dcef627954a0ed3fa55d2cb7b28d185

patches:
  - path: namespace-patch.yaml
    target:
      kind: Namespace
      name: civicfix
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: civicfix-app-config
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: civicfix-backend
  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: civicfix-frontend
  - path: remove-in-cluster-postgres.yaml
