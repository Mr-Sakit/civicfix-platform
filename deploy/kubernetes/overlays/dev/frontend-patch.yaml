apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicfix-frontend
  labels:
    civicfix.io/environment: dev
spec:
  replicas: 1
  template:
    metadata:
      labels:
        civicfix.io/environment: dev
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
