apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicfix-backend
  labels:
    civicfix.io/environment: dev
spec:
  replicas: 1
  template:
    metadata:
      labels:
        civicfix.io/environment: dev
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
