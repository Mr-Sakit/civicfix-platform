apiVersion: v1
kind: ConfigMap
metadata:
  name: civicfix-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: civicfix-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - civicfix-backend.civicfix-student.svc.cluster.local:4000

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
