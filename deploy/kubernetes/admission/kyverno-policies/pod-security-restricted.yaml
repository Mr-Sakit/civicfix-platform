apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: civicfix-pod-security-restricted
  labels:
    app.kubernetes.io/name: civicfix-admission-policy
    app.kubernetes.io/part-of: civicfix-platform
    civicfix.io/control: pod-security
  annotations:
    policies.kyverno.io/title: CivicFix Restricted Pod Security
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Audits CivicFix production Pods against the Kubernetes restricted Pod
      Security Standard. This starts in Audit mode so the team can verify
      compatibility before enforcing admission denial.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: restricted-pod-security
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - civicfix-prod
      validate:
        podSecurity:
          level: restricted
          version: latest
