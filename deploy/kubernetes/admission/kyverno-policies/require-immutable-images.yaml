apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: civicfix-require-immutable-images
  labels:
    app.kubernetes.io/name: civicfix-admission-policy
    app.kubernetes.io/part-of: civicfix-platform
    civicfix.io/control: image-provenance
  annotations:
    policies.kyverno.io/title: CivicFix Require Immutable Image References
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Audits production Pods that use mutable latest image tags. Production
      GitOps overlays should deploy immutable commit SHA tags, and this policy
      gives admission-level evidence of that requirement.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: block-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - civicfix-prod
      validate:
        message: Production Pods must not use mutable ':latest' image tags.
        foreach:
          - list: request.object.spec.containers[]
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('.*:latest$', element.image) }}"
                    operator: Equals
                    value: true
          - list: request.object.spec.initContainers || `[]`
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('.*:latest$', element.image) }}"
                    operator: Equals
                    value: true
