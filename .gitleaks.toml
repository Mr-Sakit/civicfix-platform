title = "CivicFix Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "kubernetes-grafana-admin-password"
description = "Detect committed Grafana admin passwords in Kubernetes manifests"
regex = '''(?i)GF_SECURITY_ADMIN_PASSWORD\s*:\s*["']([^"']{8,})["']'''
secretGroup = 1
keywords = [
  "GF_SECURITY_ADMIN_PASSWORD",
]

[[rules.allowlists]]
description = "Allow documented placeholder values only"
regexes = [
  '''replace-with-[a-z0-9-]+''',
]

[[rules]]
id = "kubernetes-password-like-stringdata"
description = "Detect password-like values committed under Kubernetes stringData"
regex = '''(?i)(password|passwd|pwd|secret|token|api[_-]?key)\s*:\s*["']([^"']{8,})["']'''
secretGroup = 2
keywords = [
  "password",
  "passwd",
  "secret",
  "token",
  "api_key",
  "apikey",
]

[[rules.allowlists]]
description = "Allow placeholders and local-only example values"
regexes = [
  '''replace-with-[a-z0-9-]+''',
  '''your-[a-z0-9-]+''',
  '''change-me''',
  '''changeme''',
]
