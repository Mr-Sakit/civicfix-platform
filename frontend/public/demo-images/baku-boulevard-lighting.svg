    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7a8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff7a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="540" fill="url(#night)"/>
  <circle cx="785" cy="80" r="36" fill="#f8fafc" opacity=".8"/>
  <rect y="360" width="960" height="180" fill="#0f766e"/>
  <path d="M0 350c150-55 265 30 420-5s280-110 540-30v225H0z" fill="#075985"/>
